# Staging: everything on one droplet. Run from this directory on the server:
#   docker compose up -d
# Secrets and hostnames come from .env next to this file (see .env.staging.example, generate-secrets.sh).
# Only Caddy publishes ports; Postgres, Redis and RabbitMQ are reachable on the internal network only.
# Memory limits default to a 2 GB droplet (with a swap file); see .env.staging.example for 4 GB values.
name: mobility-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: staging
  TZ: UTC

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_HOST: ${API_HOST:?set API_HOST in .env}
      LOCATION_HOST: ${LOCATION_HOST:?set LOCATION_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      core-app:
        condition: service_healthy
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    logging: *logging

  core-app:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY in .env}/core-app:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      <<: *app-env
      DB_HOST: postgres
      DB_NAME: mobility
      DB_USERNAME: mobility_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: mobility
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?}
      OTP_FIXED_CODE: ${OTP_FIXED_CODE:-}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
      IDEMPOTENCY_ENCRYPTION_KEY: ${IDEMPOTENCY_ENCRYPTION_KEY:?}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?}
      PII_HASH_SECRET: ${PII_HASH_SECRET:?}
      # local: the documents volume below; s3: Spaces (the app refuses to start without the S3 settings).
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_DIR: /data/storage
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      # Heap share of mem_limit; the rest is metaspace, threads and buffers (~200 MB).
      JAVA_TOOL_OPTIONS: ${CORE_APP_JAVA_OPTS:--XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError}
    volumes:
      # Encrypted document files while STORAGE_TYPE=local (moving to Spaces: docs/staging.md).
      - documents:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: ${CORE_APP_MEM_LIMIT:-768m}
    logging: *logging

  location-service:
    image: ${IMAGE_REPOSITORY}/location-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *app-env
      JAVA_TOOL_OPTIONS: ${LOCATION_SERVICE_JAVA_OPTS:--XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: ${LOCATION_SERVICE_MEM_LIMIT:-256m}
    logging: *logging

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      # Superuser for administration and backups only; the apps connect as mobility_app (postgres/init).
      POSTGRES_DB: mobility
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      TZ: UTC
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-64MB}", "-c", "max_connections=50"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mobility"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEM_LIMIT:-384m}
    shm_size: 128m
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # The password is passed via env so it does not show up in `ps` on the host.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory \"$$REDIS_MAXMEMORY\" --maxmemory-policy noeviction --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-64mb}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${REDIS_MEM_LIMIT:-96m}
    logging: *logging

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mobility
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/20-staging.conf:/etc/rabbitmq/conf.d/20-staging.conf:ro
    # Management UI on the droplet's loopback only: ssh -L 15672:localhost:15672 <droplet>
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    mem_limit: ${RABBITMQ_MEM_LIMIT:-320m}
    logging: *logging

volumes:
  documents:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  rabbitmq-data:
