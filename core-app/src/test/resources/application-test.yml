# Integration tests. Connections come from Testcontainers (@ServiceConnection).
management:
  endpoint:
    health:
      show-components: always

identity:
  otp:
    hmac-secret: test-otp-secret-0123456789abcdefghijkl
  token:
    allow-generated-keys: true

idempotency:
  encryption-key: dGVzdC1pZGVtcG90ZW5jeS1lbmNyeXB0aW9uLWtleSE=

pii:
  encryption-key: dGVzdC1waWktZW5jcnlwdGlvbi1rZXktMzJieXRlcyE=
  hash-secret: test-pii-hash-secret-0123456789abcdef

storage:
  local:
    dir: target/test-storage

scheduling:
  enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

web-console:
  allowed-origins: http://localhost:3000

pricing:
  # Each test class prices its own city, so rule versions of one test never affect another.
  cities: PHNOM_PENH,TEST_01,TEST_02,TEST_03,TEST_04,TEST_05,TEST_06,TEST_07,TEST_08,TEST_09,TEST_10,TEST_11,TEST_12,TEST_13,TEST_14,TEST_15,TEST_16,TEST_17,TEST_18,TEST_19,TEST_20,TEST_21,TEST_22,TEST_23,TEST_24,TEST_25,TEST_26,TEST_27,TEST_28,TEST_29,TEST_30,TEST_31,TEST_32,TEST_33,TEST_34,TEST_35,TEST_36,TEST_37,TEST_38,TEST_39,TEST_40,TEST_41,TEST_42,TEST_43,TEST_44,TEST_45,TEST_46,TEST_47,TEST_48,TEST_49,TEST_50,TEST_51,TEST_52,TEST_53,TEST_54,TEST_55,TEST_56,TEST_57,TEST_58,TEST_59,TEST_60
