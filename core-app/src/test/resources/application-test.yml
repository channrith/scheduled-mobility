# Integration tests. Connections come from Testcontainers (@ServiceConnection).
management:
  endpoint:
    health:
      show-components: always

identity:
  otp:
    hmac-secret: test-otp-secret-0123456789abcdefghijkl
  token:
    allow-generated-keys: true

idempotency:
  encryption-key: dGVzdC1pZGVtcG90ZW5jeS1lbmNyeXB0aW9uLWtleSE=

pii:
  encryption-key: dGVzdC1waWktZW5jcnlwdGlvbi1rZXktMzJieXRlcyE=
  hash-secret: test-pii-hash-secret-0123456789abcdef

storage:
  local:
    dir: target/test-storage

scheduling:
  enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
