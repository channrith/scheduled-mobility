# Staging (deploy/staging): behind Caddy on a single droplet. Hosts and secrets still come from env vars.
server:
  # Trust X-Forwarded-For/-Proto/-Host from Caddy. Tomcat only accepts them from private-network proxies,
  # and the app port is never published outside the Docker network.
  forward-headers-strategy: native

logging:
  # One JSON object per line on stdout (docker logs / any log shipper).
  structured:
    format:
      console: ecs

springdoc:
  # Staging is non-production: the API docs are on unless API_DOCS_ENABLED=false.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
