# Shared configuration. Secrets and hosts come from environment variables only;
# the "local" profile (application-local.yml) supplies dev defaults.
spring:
  application:
    name: core-app
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # Documents are limited to 10 MB per side by the application (clear error code); these are the
      # hard limits. A request carries up to two sides. Keep deploy/staging/Caddyfile in line.
      max-file-size: 11MB
      max-request-size: 23MB
  messages:
    basename: i18n/shared,i18n/identity,i18n/driver
    fallback-to-system-locale: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    default-schema: public
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

identity:
  otp:
    hmac-secret: ${OTP_HMAC_SECRET}
    # Test environments only (no SMS gateway): every phone logs in with this code. Refused in production.
    fixed-code: ${OTP_FIXED_CODE:}
  bootstrap:
    # Granted ADMIN at startup while no ADMIN exists yet; ignored afterwards.
    admin-phone: ${BOOTSTRAP_ADMIN_PHONE:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
  token:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    private-key-file: ${JWT_PRIVATE_KEY_FILE:}
    public-key-file: ${JWT_PUBLIC_KEY_FILE:}

idempotency:
  encryption-key: ${IDEMPOTENCY_ENCRYPTION_KEY}

pii:
  encryption-key: ${PII_ENCRYPTION_KEY}
  hash-secret: ${PII_HASH_SECRET}

storage:
  # local (filesystem, development) or s3 (any S3-compatible store). Objects are encrypted either way.
  type: ${STORAGE_TYPE:local}
  local:
    dir: ${STORAGE_LOCAL_DIR:./var/storage}
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:}
    region: ${STORAGE_S3_REGION:us-east-1}
    bucket: ${STORAGE_S3_BUCKET:}
    access-key: ${STORAGE_S3_ACCESS_KEY:}
    secret-key: ${STORAGE_S3_SECRET_KEY:}

springdoc:
  # Off unless explicitly enabled: a public spec maps out the admin API for attackers.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
  # Error responses are documented by OpenApiConventions, not inferred from @ControllerAdvice.
  override-with-generic-response: false
  writer-with-order-by-keys: true
  paths-to-exclude: /api/v1/test/**

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
