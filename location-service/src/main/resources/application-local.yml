spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:mobility}

location:
  core:
    base-url: ${CORE_BASE_URL:http://localhost:8080}

  tracking:
    events-channel: ${LOCATION_EVENTS_CHANNEL:mobility:local:driver-location:v1}

logging:
  level:
    com.mobility.location.realtime: ${LOCATION_REALTIME_LOG_LEVEL:INFO}

management:
  endpoint:
    health:
      show-details: always
