spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:mobility}

location:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:${JWT_PUBLIC_KEY_FILE:}}

  core:
    base-url: ${CORE_BASE_URL:http://localhost:8080}

  tracking:
    events-channel: ${LOCATION_EVENTS_CHANNEL:mobility:local:driver-location:v1}

  logging:
    level:
      com.mobility.location.realtime: DEBUG

  server:
    error:
      include-message: always

logging:
  level:
    com.mobility.location.realtime: DEBUG

management:
  endpoint:
    health:
      show-details: always
