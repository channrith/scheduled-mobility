spring:
  application:
    name: location-service

  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

location:
  jwt:
    jwks-uri: ${JWT_JWKS_URI:}
    public-key: ${JWT_PUBLIC_KEY:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:${JWT_PUBLIC_KEY_FILE:}}
    issuer: ${JWT_ISSUER:mobility-core}
  core:
    base-url: ${CORE_BASE_URL}
  tracking:
    max-age: ${LOCATION_MAX_AGE:120s}
    future-tolerance: ${LOCATION_FUTURE_TOLERANCE:30s}
    max-accuracy-meters: ${LOCATION_MAX_ACCURACY_METERS:100}
    retention: ${LOCATION_RETENTION:24h}
    max-speed-meters-per-second: ${LOCATION_MAX_SPEED_METERS_PER_SECOND:60}
    reacquisition-gap: ${LOCATION_REACQUISITION_GAP:120s}
    events-channel: ${LOCATION_EVENTS_CHANNEL:mobility:driver-location:v1}

  presence:
    timeout: ${LOCATION_PRESENCE_TIMEOUT:60s}

  logging:
    requests-enabled: ${LOCATION_REQUEST_LOGGING_ENABLED:true}

logging:
  level:
    com.mobility.location: ${LOCATION_LOG_LEVEL:INFO}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
