# Local development infrastructure. Credentials come from .env (see .env.example).
name: mobility

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME:-mobility}
      POSTGRES_USER: ${DB_USERNAME:-mobility}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mobility}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-mobility}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mobility}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-mobility}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mobility}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Admin web console (Next.js). The gateway runs on the host (scripts/run-local.sh), reached via
  # host.docker.internal. For day-to-day frontend work `npm run dev` in web-console/ is faster.
  web-console:
    build: ./web-console
    environment:
      CORE_API_URL: ${CORE_API_URL:-http://host.docker.internal:${GATEWAY_SERVER_PORT:-8090}}
      # Plain http on localhost: session cookies cannot be marked Secure.
      COOKIE_INSECURE: "true"
    ports:
      - "${WEB_CONSOLE_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
